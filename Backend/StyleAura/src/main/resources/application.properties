spring.application.name=StyleAura

server.port=8080

# Use environment variables with fallbacks for local development
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/styleaura_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (Externalized)
jwt.secret=${JWT_SECRET:StyleAuraSecretKeyForJwtAuthentication2026StyleAura123456}
jwt.expiration=${JWT_EXPIRATION:86400000}

logging.level.org.springframework.security=TRACE
logging.level.com.styleaura=DEBUG

